# Which chat event to hook.
#   auto   - Paper's per-viewer chat renderer when available, otherwise the Bukkit event.
#   paper  - force the Paper renderer (fails to enable on Spigot).
#   bukkit - force the Bukkit event even on Paper (useful for testing that path).
listener: auto

# Log every chat decision (which viewers get the visual form). Noisy; for troubleshooting only.
debug: false

# Clients from Minecraft 1.16.2 on shape and reorder Arabic script themselves in every language
# and must receive the original text. Detection order: ViaVersion (exact client version on
# multi-version servers), Paper's Player#getProtocolVersion, else clients are assumed to match
# the server version.
#   auto   - detect per player
#   legacy - treat every client as older than 1.16.2 (always send the visual form)
#   modern - treat every client as 1.16.2 or newer (never send the visual form, except by locale)
assume-clients: auto

# Client languages whose renderer already draws right-to-left text correctly on clients older
# than 1.16.2 (Minecraft marks them "bidirectional"). Players using one of these receive the message untouched; everyone else
# receives the shaped and reordered form. Match on the language part of the locale, so
# "fa" covers fa_ir, fa_IR and any other Persian variant.
rtl-locales:
  - fa
  - ar
